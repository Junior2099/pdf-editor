<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor Pro - Edição de Páginas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="https://img.icons8.com/?size=100&id=mcyAsTDJNTI9&format=png&color=000000" type="image/png">
  <style>
    :root {
      --primary-color: #4a6bdf;
      --secondary-color: #f8f9fa;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
      --text-color: #333;
      --light-text: #777;
      --border-color: #ddd;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: var(--text-color);
      line-height: 1.6;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .app-header {
      background-color: var(--primary-color);
      color: white;
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .app-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .main-container {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: white;
    }

    .btn-success {
      background-color: var(--success-color);
      color: white;
    }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .editor-container {
      display: flex;
      gap: 2rem;
      height: calc(100vh - 250px);
    }

    .thumbnail-sidebar {
      width: 350px;
      background-color: white;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: var(--shadow);
      overflow-y: auto;
    }

    .thumbnail-sidebar h3 {
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .thumbnails-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
    }

    .thumbnail-item {
      position: relative;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px;
    }

    .thumbnail-item:hover {
      border-color: var(--primary-color);
    }

    .thumbnail-item.selected {
      border-color: var(--danger-color);
      background: #ffeaea;
    }

    .thumbnail-img {
      width: 100%;
      height: auto;
      max-height: 150px;
      object-fit: contain;
    }

    .thumbnail-number {
      margin-top: 5px;
      font-size: 0.8rem;
      color: var(--light-text);
    }

    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: white;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .preview-container h3 {
      padding: 1rem;
      margin: 0;
      border-bottom: 1px solid var(--border-color);
    }

    .pdf-preview {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow: auto;
    }

    .preview-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      padding: 1rem;
      border-top: 1px solid var(--border-color);
      background-color: var(--secondary-color);
    }
  </style>
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <h1><i class="fas fa-file-pdf"></i> PDF Editor Pro</h1>
      <p>Gerencie páginas do PDF com facilidade</p>
    </header>

    <div class="main-container">
      <div class="toolbar">
        <label for="pdf-upload" class="btn btn-primary">
          <i class="fas fa-upload"></i> Carregar PDF
          <input type="file" id="pdf-upload" accept=".pdf" style="display:none;">
        </label>
        <button id="delete-selected-btn" class="btn btn-danger" disabled>
          <i class="fas fa-trash"></i> Excluir Selecionadas
        </button>
        <button id="download-btn" class="btn btn-success" disabled>
          <i class="fas fa-download"></i> Baixar PDF
        </button>
      </div>

      <div class="editor-container">
        <div class="thumbnail-sidebar">
          <h3>Miniaturas</h3>
          <div id="thumbnails-container" class="thumbnails-container"></div>
        </div>

        <div class="preview-container">
          <h3>Visualização</h3>
          <div id="pdf-preview" class="pdf-preview">
            <p style="color:#777;">Carregue um PDF para visualizar</p>
          </div>
          <div class="preview-controls">
            <button id="prev-page" class="btn" disabled><i class="fas fa-chevron-left"></i> Anterior</button>
            <span id="page-num">Página: 0/0</span>
            <button id="next-page" class="btn" disabled>Próxima <i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

    let pdfDoc = null, currentPdfBytes = null, pageNum = 1;
    let selectedPages = [];

    const pdfUpload = document.getElementById("pdf-upload"),
      thumbnailsContainer = document.getElementById("thumbnails-container"),
      pdfPreview = document.getElementById("pdf-preview"),
      pageNumSpan = document.getElementById("page-num"),
      prevPageBtn = document.getElementById("prev-page"),
      nextPageBtn = document.getElementById("next-page"),
      deleteSelectedBtn = document.getElementById("delete-selected-btn"),
      downloadBtn = document.getElementById("download-btn");

    pdfUpload.addEventListener("change", handleFileUpload);
    prevPageBtn.addEventListener("click", () => changePage(-1));
    nextPageBtn.addEventListener("click", () => changePage(1));
    deleteSelectedBtn.addEventListener("click", deleteSelectedPages);
    downloadBtn.addEventListener("click", downloadModifiedPdf);

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file || file.type !== "application/pdf") return;
      const fileReader = new FileReader();
      fileReader.onload = async () => {
        currentPdfBytes = new Uint8Array(fileReader.result);
        await loadPdf(currentPdfBytes);
      };
      fileReader.readAsArrayBuffer(file);
    }

    async function loadPdf(data) {
      pdfDoc = await pdfjsLib.getDocument(data).promise;
      pageNum = 1;
      selectedPages = [];
      thumbnailsContainer.innerHTML = "";
      pdfPreview.innerHTML = "";
      downloadBtn.disabled = false;
      renderPage(pageNum);
      renderThumbnails();
    }

    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 1.2 });
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: ctx, viewport }).promise;
      pdfPreview.innerHTML = "";
      pdfPreview.appendChild(canvas);
      pageNumSpan.textContent = `Página: ${num}/${pdfDoc.numPages}`;
      prevPageBtn.disabled = num <= 1;
      nextPageBtn.disabled = num >= pdfDoc.numPages;
    }

    async function renderThumbnails() {
      thumbnailsContainer.innerHTML = "";
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 0.2 });
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: ctx, viewport }).promise;

        const item = document.createElement("div");
        item.className = "thumbnail-item";
        item.innerHTML = `<img src="${canvas.toDataURL()}" class="thumbnail-img"><div class="thumbnail-number">Página ${i}</div>`;
        item.addEventListener("click", () => toggleSelectPage(i, item));
        thumbnailsContainer.appendChild(item);
      }
    }

    function toggleSelectPage(pageIndex, element) {
      if (selectedPages.includes(pageIndex)) {
        selectedPages = selectedPages.filter(p => p !== pageIndex);
        element.classList.remove("selected");
      } else {
        selectedPages.push(pageIndex);
        element.classList.add("selected");
      }
      deleteSelectedBtn.disabled = selectedPages.length === 0;
    }

    async function deleteSelectedPages() {
      if (!selectedPages.length) return;
      const confirmDel = confirm(`Deseja excluir as páginas: ${selectedPages.join(", ")}?`);
      if (!confirmDel) return;
      const pdfDocLib = await PDFLib.PDFDocument.load(currentPdfBytes);
      selectedPages.sort((a, b) => b - a).forEach(p => pdfDocLib.removePage(p - 1));
      const newBytes = await pdfDocLib.save();
      currentPdfBytes = newBytes;
      await loadPdf(newBytes);
      alert("Páginas removidas com sucesso!");
    }

    async function changePage(offset) {
      pageNum += offset;
      if (pageNum < 1) pageNum = 1;
      if (pageNum > pdfDoc.numPages) pageNum = pdfDoc.numPages;
      renderPage(pageNum);
    }

    function downloadModifiedPdf() {
      if (!currentPdfBytes) return;
      saveAs(new Blob([currentPdfBytes], { type: "application/pdf" }), "documento-modificado.pdf");
    }
  </script>
</body>
</html>
